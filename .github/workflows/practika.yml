name: Build and Publish

on:
  push:
    branches: ["practika-develop", "develop"]

jobs:
  build-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and Push Server
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/eduplatform-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-web:
    needs: build-server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and Push Web
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: frontend/packages/web/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/eduplatform-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-admin:
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and Push Admin
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: frontend/packages/admin/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/eduplatform-admin:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-tgbot:
    needs: build-admin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and Push Bot
        uses: docker/build-push-action@v5
        with:
          context: ./tgbot
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/eduplatform-tgbot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-vm:
    needs: build-tgbot
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
            
            docker pull ${{ secrets.DOCKER_USERNAME }}/eduplatform-server:latest
            docker pull ${{ secrets.DOCKER_USERNAME }}/eduplatform-web:latest
            docker pull ${{ secrets.DOCKER_USERNAME }}/eduplatform-admin:latest
            docker pull ${{ secrets.DOCKER_USERNAME }}/eduplatform-tgbot:latest
            
            docker compose up -d --remove-orphans
            
            docker image prune -f