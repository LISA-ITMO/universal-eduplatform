version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: edu_postgres
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  server:
    build: ./server
    container_name: edu_server
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://myuser:mypassword@db:5432/mydb?schema=public"
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy && node dist/main.js"
    restart: always

  web:
    build:
      context: ./frontend        
      dockerfile: packages/web/Dockerfile 
    container_name: edu_web
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: always

  admin:
    build:
      context: ./frontend      
      dockerfile: packages/admin/Dockerfile
    container_name: edu_admin
    ports:
      - "8081:80"
    depends_on:
      - server
    restart: always

volumes:
  postgres_data: