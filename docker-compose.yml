version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: edu_postgres
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - quiznet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quizuser} -d ${POSTGRES_DB:-quiz}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgbackups:
    image: prodrigestivill/postgres-backup-local
    container_name: edu_pgbackups
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 3
      BACKUP_KEEP_MONTHS: 6
    networks:
      - quiznet
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

  server:
    image: ${DOCKER_USERNAME}/eduplatform-server:latest
    container_name: edu_server
    env_file:
      - .env
    ports:
      - "3000:3000"
    networks:
      - quiznet
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy && node dist/main.js"
    restart: unless-stopped

  web:
    image: ${DOCKER_USERNAME}/eduplatform-web:latest
    container_name: edu_web
    ports:
      - "8888:80"
    networks:
      - quiznet
    depends_on:
      - server
    restart: unless-stopped

  admin:
    image: ${DOCKER_USERNAME}/eduplatform-admin:latest
    container_name: edu_admin
    ports:
      - "9999:80"
    networks:
      - quiznet
    depends_on:
      - server
    restart: unless-stopped

  bot:
    image: ${DOCKER_USERNAME}/eduplatform-tgbot:latest
    container_name: edu_tgbot
    env_file:
      - .env
    networks:
      - quiznet
    depends_on:
      - server
    restart: unless-stopped

networks:
  quiznet:
    driver: bridge

volumes:
  postgres_data: