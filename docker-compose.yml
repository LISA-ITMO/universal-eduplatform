version: "3.8"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quiz}
      POSTGRES_USER: ${POSTGRES_USER:-quiz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quiz}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - quiznet
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-quiz} -d ${POSTGRES_DB:-quiz}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    ports:
      - "3000:3000"
    networks:
      - quiznet
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        APP: web
    ports:
      - "8888:80"
    networks:
      - quiznet
    depends_on:
      - server
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        APP: admin
    ports:
      - "9999:80"
    networks:
      - quiznet
    depends_on:
      - server
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    env_file:
      - .env
    environment:
      - PLATFORM_ADDRESS=http://web:80
    networks:
      - quiznet
    depends_on:
      - server
    restart: unless-stopped

networks:
  quiznet:
    driver: bridge

volumes:
  db-data:
